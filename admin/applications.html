<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0c0e12">
  <title>Application review — Roblox Editors</title>
  <style>
    :root{color-scheme:dark;--bg:#0c0e12;--panel:#14181f;--line:#262d38;--text:#eef1f6;--muted:#a0aab8;--accent:#7af500;--ok:#4ade80;--bad:#f87171}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    a{color:var(--accent);overflow-wrap:anywhere}.wrap{max-width:980px;margin:auto;padding:22px 16px 60px}
    header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px}
    h1{font-size:21px;margin:0}.muted{color:var(--muted);font-size:13px}.panel,.application{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;margin-top:14px}
    input,select,button{font:inherit;border-radius:8px;padding:10px 12px}input,select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text)}
    button{background:#202630;color:var(--text);border:1px solid var(--line);font-weight:700;cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#061109}button:disabled{opacity:.5}
    #gate{max-width:380px;margin:12vh auto;padding:0 16px}#gate button{width:100%;margin-top:12px}label{display:block;font-size:13px;margin-bottom:6px}
    .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row>*{flex:1}.row button{flex:0 0 auto}.hidden{display:none!important}
    .status{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}.pending{color:#fbbf24}.approved{color:var(--ok)}.rejected{color:var(--bad)}
    .application h2{font-size:18px;margin:0 0 4px}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.detail{min-width:0}.detail strong{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.detail span{overflow-wrap:anywhere}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1}.actions .approve{border-color:#27633c;color:var(--ok)}.actions .reject{border-color:#6b3030;color:var(--bad)}
    #notice{margin-top:12px;font-size:14px}.error{color:#ffb4b4}.good{color:#c9ffb0}.empty{padding:24px;text-align:center;color:var(--muted)}
    @media(max-width:560px){.details{grid-template-columns:1fr}.row>*{flex-basis:100%}}
  </style>
</head>
<body>
  <main id="gate">
    <h1>🔒 Application review</h1>
    <p class="muted">Admin password required. Applications are private.</p>
    <label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password">
    <button class="primary" id="login">Open applications</button><p id="loginError" class="error" aria-live="polite"></p>
  </main>
  <main id="app" class="wrap hidden">
    <header><div><h1>Editor applications</h1><p class="muted">Reviewing applications does not change the public rankings.</p></div><div class="row" style="flex:0 1 360px"><select id="filter" aria-label="Filter applications"><option value="all">All statuses</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select><button id="refresh">Refresh</button></div></header>
    <p id="notice" aria-live="polite"></p><section id="applications"></section>
  </main>
  <script>
    const gate = document.querySelector("#gate");
    const app = document.querySelector("#app");
    const passwordInput = document.querySelector("#password");
    const loginButton = document.querySelector("#login");
    const loginError = document.querySelector("#loginError");
    const notice = document.querySelector("#notice");
    const list = document.querySelector("#applications");
    const filter = document.querySelector("#filter");
    let adminPassword = "";
    let applications = [];

    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[char]));

    async function api(payload) {
      const response = await fetch("/api/applications/admin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...payload, password: adminPassword })
      });
      const result = await response.json().catch(() => ({}));
      if (response.status === 401) {
        adminPassword = "";
        gate.classList.remove("hidden");
        app.classList.add("hidden");
        throw new Error("Admin password was rejected. Please sign in again.");
      }
      if (!response.ok) throw new Error(result.error || "Request failed.");
      return result;
    }

    async function loadApplications() {
      notice.className = "muted";
      notice.textContent = "Loading applications…";
      try {
        const result = await api({ action: "list" });
        applications = result.applications || [];
        gate.classList.add("hidden");
        app.classList.remove("hidden");
        render();
        notice.textContent = applications.length === 100
          ? "Showing the 100 most recent applications."
          : applications.length + " application(s) loaded.";
      } catch (error) {
        notice.className = "error";
        notice.textContent = error.message;
      }
    }

    function render() {
      const shown = applications.filter((item) => filter.value === "all" || item.status === filter.value);
      if (!shown.length) {
        list.innerHTML = '<div class="panel empty">No applications in this view.</div>';
        return;
      }
      list.innerHTML = shown.map((item) => {
        const date = item.created_at ? new Date(item.created_at).toLocaleString() : "Unknown date";
        const status = ["pending","approved","rejected"].includes(item.status) ? item.status : "pending";
        return `<article class="application">
          <div class="row"><div><h2>${escapeHtml(item.display_name)}</h2><div class="muted">Submitted ${escapeHtml(date)}</div></div><span class="status ${status}">${status}</span></div>
          <div class="details">
            <div class="detail"><strong>Main account (${escapeHtml(item.platform)})</strong><span><a href="${escapeHtml(item.profile_url)}" target="_blank" rel="noopener noreferrer">Open profile ↗</a></span></div>
            <div class="detail"><strong>Editing software</strong><span>${escapeHtml(item.software)}</span></div>
            <div class="detail"><strong>Editing styles</strong><span>${escapeHtml(Array.isArray(item.styles) ? item.styles.join(", ") : "")}</span></div>
            <div class="detail"><strong>Examples</strong><span><a href="${escapeHtml(item.examples_url)}" target="_blank" rel="noopener noreferrer">View examples ↗</a></span></div>
            ${item.notes ? `<div class="detail" style="grid-column:1/-1"><strong>Additional notes</strong><span>${escapeHtml(item.notes)}</span></div>` : ""}
          </div>
          <div class="actions"><button class="approve" data-id="${escapeHtml(item.id)}" data-status="approved">Approve application</button><button data-id="${escapeHtml(item.id)}" data-status="pending">Mark pending</button><button class="reject" data-id="${escapeHtml(item.id)}" data-status="rejected">Reject application</button></div>
        </article>`;
      }).join("");
    }

    loginButton.addEventListener("click", async () => {
      adminPassword = passwordInput.value;
      loginButton.disabled = true;
      loginError.textContent = "";
      try {
        await loadApplications();
        if (!app.classList.contains("hidden")) passwordInput.value = "";
      } catch (error) {
        loginError.textContent = error.message;
      } finally {
        loginButton.disabled = false;
      }
    });
    passwordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") loginButton.click();
    });
    document.querySelector("#refresh").addEventListener("click", loadApplications);
    filter.addEventListener("change", render);
    list.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-id]");
      if (!button) return;
      const { id, status } = button.dataset;
      button.disabled = true;
      notice.className = "muted";
      notice.textContent = "Updating application…";
      try {
        await api({ action: "update", id, status });
        const item = applications.find((application) => application.id === id);
        if (item) item.status = status;
        render();
        notice.className = "good";
        notice.textContent = "Application status updated. Rankings were not changed.";
      } catch (error) {
        notice.className = "error";
        notice.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
