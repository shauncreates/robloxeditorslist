<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin — Roblox Editors</title>
<link rel="stylesheet" href="../assets/typography.css">
<link rel="stylesheet" href="../assets/profile.css">
<link rel="stylesheet" href="../assets/actions.css">
<style>
  [hidden]{display:none!important}
  :root{--bg:#050706;--panel:#0b100c;--panel2:#111912;--line:#202a22;--text:#eef5ef;--muted:#98a79b;--accent:#7af500;--on-accent:#061109;--ok:#7af500;--bad:#ff7373}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5;min-height:100vh}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px 80px}
  .top{position:sticky;top:0;z-index:5;background:#0a0c12ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .top .wrap{display:flex;gap:10px;align-items:center;padding-block:12px;flex-wrap:wrap}
  .top h1{font-size:16px;flex:1;min-width:140px}
  .status{font-size:13px;color:var(--muted)}
  .status.ok{color:var(--ok)} .status.bad{color:var(--bad)} .status.dirty{color:#fbbf24}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:9px 14px;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .18s ease,border-color .18s ease,background .18s ease}
  button:hover{border-color:var(--accent);transform:translateY(-1px)}
  button:disabled{opacity:.4;cursor:default}
  button.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  button.bad:hover{border-color:var(--bad);color:var(--bad)}
  button.sm{padding:4px 10px;font-size:13px}
  .tabs{display:flex;gap:7px;margin:22px 0;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
  .tabs button{background:transparent;border-color:transparent;color:var(--muted);border-radius:6px}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin:24px 0 7px}
  .page-title{font-size:clamp(26px,5vw,38px);line-height:1.08;letter-spacing:-.03em;text-transform:uppercase}
  .page-subtitle{color:var(--muted);margin:9px 0 20px}
  .rank-list{display:grid;gap:8px}.rrow{transition:transform .22s cubic-bezier(.2,.8,.2,1),border-color .18s ease,background .18s ease}
  .rrow[draggable="true"]{cursor:grab;touch-action:pan-y}.rrow.dragging{opacity:.42;transform:scale(.985)}.rrow.drop-target{border-color:var(--accent);background:#7af50012}
  .drag-handle{font-size:18px;color:var(--muted);cursor:grab;user-select:none;letter-spacing:-3px;padding-right:5px}
  .app-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:10px 0;animation:rise .22s ease both}
  .app-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.app-detail{min-width:0}.app-detail strong{display:block;color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}.app-detail span,.app-detail a{overflow-wrap:anywhere}
  .app-status{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);padding:4px 8px;border-radius:99px}.app-status.pending{color:#ffd166}.app-status.approved{color:var(--accent)}.app-status.rejected{color:var(--bad)}
  .app-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.app-actions button{flex:1}.app-actions .approve{border-color:#345c1b;color:var(--accent)}.app-actions .reject{border-color:#663333;color:var(--bad)}
  .empty-state{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
  @media(max-width:560px){.app-grid{grid-template-columns:1fr}.rrow{flex-wrap:wrap}.rrow .nm{min-width:100px}}
  .msg{background:#4ade8014;border:1px solid #4ade8044;color:#bbf7d0;padding:10px 14px;border-radius:10px;font-size:13.5px;margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.08em}
  input[type=text],input[type=url],input[type=password],textarea,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14.5px;font-family:inherit;outline:none}
  input[type=color]{width:46px;height:38px;background:none;border:1px solid var(--line);border-radius:9px;padding:2px}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  textarea{min-height:70px;resize:vertical}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .flarepick{display:flex;gap:8px;flex-wrap:wrap}
  .flarepick label{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;text-transform:none;letter-spacing:0;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:5px 11px;cursor:pointer}
  details.card summary{cursor:pointer;font-weight:800;display:flex;justify-content:space-between;gap:10px;align-items:center}
  details.card summary span.sub{color:var(--muted);font-weight:500;font-size:13px}
  .rrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px}
  .rrow .n{width:34px;font-weight:900;color:var(--muted)}
  .rrow .nm{flex:1;font-weight:700}
  .srow{display:flex;gap:10px;align-items:center}
  .srow input[type=text]{flex:1}
  .hint{color:var(--muted);font-size:13.5px;margin:6px 0 14px}
  .inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
  [data-act=fetchLegacy]{min-height:44px;border-color:#68796b}
  [data-act=fetchLegacy]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .inline select{width:auto;min-width:200px;flex:1}
  /* login gate */
  #gate{max-width:360px;margin:15vh auto 0;padding:0 16px}
  #gate h1{font-size:22px;margin-bottom:6px}
  #gate p{color:var(--muted);font-size:14px;margin-bottom:14px}
  #gate button{width:100%;margin-top:12px;padding:11px}
  #gateErr{color:var(--bad);font-size:13.5px;margin-top:10px;min-height:20px}
  .top h1{display:flex;align-items:center;gap:12px}
  .account-panel,.account-panel .card{min-width:0;overflow-wrap:anywhere}
  .app-detail a{color:var(--accent);display:inline-flex;align-items:center;min-height:44px}
  .app-card :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .account-panel input,.account-panel select,.account-panel textarea{min-width:0}
  .public-profile-link{display:inline-flex;align-items:center;min-height:44px;color:var(--accent)}
  [data-credit-user] select,[data-credit-user] button{border-color:#68796b}
  .account-panel button,.account-panel select,.account-panel .flarepick label,.account-panel form>label:has(input[type=checkbox]),#signout,#saveSite,.tabs [data-act=tab],input[data-f=software]{min-height:44px}
  .account-panel .flarepick label,.account-panel form>label:has(input[type=checkbox]){text-transform:none;letter-spacing:0;display:flex;align-items:center;gap:8px}
  .account-panel :focus-visible,#signout:focus-visible,#saveSite:focus-visible,.tabs [data-act=tab]:focus-visible,input[data-f=software]:focus-visible,.rel-brand:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #banner,#status{overflow-wrap:anywhere}
  #pendingQueue button{min-height:44px}
  #pendingQueue a{display:inline-flex;align-items:center;min-height:44px;color:var(--accent)}
</style>
</head>
<body>

<p id="bootNotice" role="status" style="padding:24px">Loading your account…</p>
<div id="ui" hidden>
  <div class="top"><div class="wrap">
    <h1><a class="rel-brand" href="/" aria-label="Roblox Editors List home"><img src="../media/logo.svg" alt="Roblox Editors List"></a><span>/ Admin</span></h1>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <button id="reset" class="bad">Discard changes</button>
    <button id="dl">Download ranking backup</button>
    <button id="saveSite" class="pri" hidden>Save now</button><a class="rel-action rel-action--account" href="/account/"><svg class="rel-icon" aria-hidden="true"><use href="/media/action-icons.svg#account"/></svg><span>My account</span></a><button id="signout">Sign out</button>
  </div></div>

  <div class="wrap">
    <p class="eyebrow">Control room</p><h2 class="page-title">Manage the list.</h2><p class="page-subtitle">Edit profiles, curate rankings and review community applications.</p>
    <div class="msg" id="banner"></div>
    <div class="tabs" id="tabs"></div>
    <div id="app"></div>
  </div>
</div>

<script type="module">
import {accountFetch,accountApi,getAccount,signOut} from "/assets/account.js";
import {createAutosave,watchChanges,announceChange} from "/assets/autosave.js";
import {animateDisclosures} from "/assets/disclosure.js";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
const LINKS = ["youtube","instagram","twitter","discord"];   // TikTok has its own username field
let openIdx = -1;   // which editor card is expanded (kept open when the list redraws)
const ONLINE = /^https?:$/.test(location.protocol);   // false when opened straight from a folder

let S = null, account, revision = null, dirty = false, editVersion = 0, tab = "editors", rk = "main";
const can = role => account?.roles.includes("owner") || account?.roles.includes(role);
const canEdit = () => S && (can("list_contributor") || account?.editor_id);
const valid = d => d && d.site && Array.isArray(d.styles) && Array.isArray(d.editors) && d.lists;

/* ---------- status / saving ---------- */
function setStatus(text, cls){ const s = $("#status"); s.textContent = text || ""; s.className = "status " + (cls || ""); }
function save(){editVersion++;dirty=true;autosave.change()}
window.addEventListener("beforeunload",ev=>{if(dirty||applicationDrafts.size||$("form[data-user][data-dirty],form[data-credit-user][data-dirty]")){ev.preventDefault();ev.returnValue=""}});
const api=accountApi;
async function loadLive(){
  revision=null;
  const r=await accountFetch("/api/account/site");
  if(!r.ok)throw Error("Live rankings could not be loaded. Saving is blocked.");
  const j=await r.json();
  if(!valid(j.data)||!j.revision)throw Error("Live rankings are invalid. Saving is blocked.");
  revision=j.revision;return j.data;
}
$("#signout").addEventListener("click",async()=>{
  if(autosave.busy||pictureFetchRunning)return setStatus("Wait for your save or picture fetch to finish before signing out.");
  if(dirty&&!confirm("Sign out and discard unsaved changes?"))return;
  autosave.pause();
  try{await signOut();dirty=false;location.replace("/signin/")}catch(e){setStatus(e.message,"bad")}
});
/* ---------- data helpers ---------- */
const byId = id => S.editors.find(e => e.id === id);
function members(key){
  if (key === "main") {
    const seen = new Set();
    return (S.lists.main || []).filter(id => byId(id) && !seen.has(id) && seen.add(id)).map(byId);
  }
  const order = S.lists[key] || [];
  const pos = id => { const i = order.indexOf(id); return i < 0 ? 1e9 : i; };
  return S.editors.filter(e => (e.flares || []).includes(key)).sort((a, b) => pos(a.id) - pos(b.id));
}
const slug = t => String(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "style";

/* ---------- views ---------- */
function allowedTabs(){
  const tabs=[];
  if(S&&can("list_contributor"))tabs.push(["editors","Editors"],["styles","Styles / flares"],["rank","Rankings"]);
  if(can("application_reviewer"))tabs.push(["applications","Applications"]);
  if(can("owner")){if(S)tabs.push(["site","Site"]);tabs.push(["links","Profile link requests"],["users","Users & roles"])}
  return tabs;
}
function view(){
  const tabs=allowedTabs();if(!tabs.some(([k])=>k===tab))tab=tabs[0]?.[0];
  $("#tabs").innerHTML=tabs.map(([k,n])=>'<button data-act="tab" data-v="'+k+'" class="'+(tab===k?'on':'')+'">'+n+'</button>').join("");
  $("#saveSite").hidden=!canEdit();$("#saveSite").disabled=!revision;
  $("#dl").hidden=!S||!can("list_contributor");$("#reset").hidden=!S;
  $("#app").innerHTML=tab?({editors:vEditors,styles:vStyles,rank:vRank,applications:vApplications,site:vSite,users:vUsers,links:vProfileLinks,claim:vClaim})[tab]():'<p class="hint">Your account is ready. Reload to try loading the list again.</p>';
  if(tab==="applications")loadApplications();if(tab==="users")loadUsers();if(tab==="editors"&&can("list_contributor"))loadPending();
  if(tab==="links")loadProfileLinks();
  animateDisclosures($("#app"));
}

function vEditors(){
  const legacyPictures = S.editors.filter(e => isLegacyBlobPicture(e.thumb)).length;
  return (can("list_contributor") ? `<div class="inline"><button class="pri" data-act="addEditor">+ Add editor</button><button data-act="fetchAll" ${pictureFetchRunning?'disabled':''}>Fetch all missing pictures</button>${legacyPictures?`<button data-act="fetchLegacy" ${pictureFetchRunning?'disabled':''}>Replace Vercel pictures (${legacyPictures})</button>`:''}</div>` : `<p class="hint">Edit your profile and software. List Contributors manage rankings and style membership.</p>`) +
    S.editors.map((e, i) => !can("list_contributor") && e.id !== account.editor_id ? "" : `
    <details class="card profile-card" data-idx="${i}" ${openIdx === i ? "open" : ""}>
      <summary><span>${esc(e.name || "(unnamed)")}</span><span class="sub">${esc((e.flares || []).map(f => S.styles.find(s => s.id === f)?.name).filter(Boolean).join(", "))}</span></summary>
      <div class="profile-body">
      <div class="two">
        <div><label>Name</label><input type="text" data-t="e" data-i="${i}" data-f="name" value="${esc(e.name)}"></div>
        <div><label>Handle (optional – shows TikTok name if empty)</label><input type="text" data-t="e" data-i="${i}" data-f="handle" value="${esc(e.handle)}"></div>
      </div>
      <div class="two">
        <div><label>TikTok username (no @)</label><input type="text" data-t="e" data-i="${i}" data-f="tiktok" value="${esc(e.tiktok)}" placeholder="e.g. someeditor"></div>
        <div><label>Profile picture</label>
          <div class="inline" style="margin:0">
            ${/^https?:\/\//.test(e.thumb || "") ? `<img src="${esc(e.thumb)}" alt="" referrerpolicy="no-referrer" style="width:38px;height:38px;border-radius:9px;object-fit:cover">` : ""}
            ${ONLINE ? `<button class="sm" data-act="fetchPic" data-i="${i}" ${pictureFetchRunning?'disabled':''}>Fetch from TikTok</button>` : `<span class="hint" style="margin:0">Fetching works on the live /admin</span>`}
          </div>
        </div>
      </div>
      <label for="editor-software-${i}">Editing software</label><input id="editor-software-${i}" type="text" maxlength="120" data-t="e" data-i="${i}" data-f="software" value="${esc(e.software)}" placeholder="e.g. After Effects, CapCut">
<label>Flares (styles)</label>
      <div class="flarepick">${S.styles.map(s => `<label><input type="checkbox" ${can("list_contributor") ? "" : "disabled"} data-t="flare" data-i="${i}" data-s="${esc(s.id)}" ${(e.flares || []).includes(s.id) ? "checked" : ""}> <span style="color:${esc(s.color)}">●</span> ${esc(s.name)}</label>`).join("") || `<span class="hint">Create styles in the Styles tab first.</span>`}</div>
      <label>About / note</label>
      <textarea data-t="e" data-i="${i}" data-f="note">${esc(e.note)}</textarea>
      <div class="two">
        <div><label>Profile picture URL (filled by Fetch, or paste your own)</label><input type="url" data-t="e" data-i="${i}" data-f="thumb" value="${esc(e.thumb)}" placeholder="https://…"></div>
        <div><label>Showcase YouTube link (optional)</label><input type="url" data-t="e" data-i="${i}" data-f="video" value="${esc(e.video)}" placeholder="https://youtube.com/watch?v=…"></div>
      </div>
      <div class="two">${LINKS.map(k => `<div><label>${k}</label><input type="url" data-t="link" data-i="${i}" data-f="${k}" value="${esc((e.links || {})[k])}" placeholder="https://…"></div>`).join("")}</div>
      ${can("list_contributor") ? `<div style="margin-top:14px"><button class="bad sm" data-act="delEditor" data-i="${i}">Delete editor</button></div>` : ""}
      </div></details>`).join("") + (can("list_contributor") ? `<details class="card profile-card" id="pendingQueue"><summary id="pendingTitle">Pending</summary><div class="profile-body"><p class="hint">Approved applications awaiting conversion to an editor profile.</p><p id="pendingNotice" role="status">Loading approved applications…</p><div id="pendingList"></div></div></details>` : "");
}

let approvedApplications = [], converting = false;
async function loadPending(){
  const title=$("#pendingTitle"),notice=$("#pendingNotice"),list=$("#pendingList");if(!list||converting)return;
  try{
    const response=await accountFetch("/api/applications/pending"),result=await response.json();
    if(!response.ok)throw new Error(result.error||"Could not load approved applications.");
    if($("#pendingList")!==list)return;
    approvedApplications=result.applications;title.textContent="Pending - ("+result.total+")";
    notice.textContent=result.total?"Conversion adds the editor to the bottom of the list. Notes and review reasons stay private.":"No approved applications are waiting.";
    list.innerHTML=approvedApplications.map(a=>`<article class="card"><h3>${esc(a.display_name)}</h3><p class="hint">${esc(a.software)} · ${esc(a.styles.join(", "))}</p><p><a href="${esc(a.profile_url)}" target="_blank" rel="noopener noreferrer">View profile</a> · <a href="${esc(a.examples_url)}" target="_blank" rel="noopener noreferrer">View examples</a></p>${a.review_reason?`<p class="hint">Review reason: ${esc(a.review_reason)}</p>`:""}<button class="pri" data-act="convertApplication" data-id="${esc(a.id)}">Convert to editor</button></article>`).join("");
    if(result.total>approvedApplications.length)notice.textContent+=" Showing the first "+approvedApplications.length+" applications; convert these to load the next batch.";
  }catch(error){notice.textContent=error.message+" This view will retry automatically."}
}

function vStyles(){
  return `<p class="hint">Each style becomes a flare and its own ranked list on the site.</p>` +
    S.styles.map((s, i) => `
    <div class="card srow">
      <input type="color" data-t="s" data-i="${i}" data-f="color" value="${esc(s.color)}">
      <input type="text" data-t="s" data-i="${i}" data-f="name" value="${esc(s.name)}">
      <button class="bad sm" data-act="delStyle" data-i="${i}">Delete</button>
    </div>`).join("") +
    `<button class="pri" data-act="addStyle">+ Add style</button>`;
}

function vRank(){
  if (rk !== "main" && !S.styles.find(s => s.id === rk)) rk = "main";
  const list = members(rk);
  const opts = [["main", "Overall Top 30"], ...S.styles.map(s => [s.id, s.name + " list"])]
    .map(([k, n]) => `<option value="${esc(k)}" ${rk === k ? "selected" : ""}>${esc(n)}</option>`).join("");
  let html = `<div class="inline"><select data-t="rk">${opts}</select></div>`;
  if (rk === "main") {
    const free = S.editors.filter(e => !list.some(x => x.id === e.id));
    html += `<div class="inline"><select id="addSel">${free.map(e => `<option value="${esc(e.id)}">${esc(e.name)}</option>`).join("") || `<option value="">(everyone is already ranked)</option>`}</select><button data-act="addMain">Add to overall list</button></div>`;
  } else {
    html += `<p class="hint">Members come from the flare you tick on each editor. Use the arrows to set their order in this list.</p>`;
  }
  html += '<div class="rank-list" id="rankList">' + list.map((e, i) => `
    <div class="rrow" draggable="true" data-rank-id="${esc(e.id)}">
      <div class="drag-handle" title="Drag to reorder" aria-label="Drag to reorder">⠿</div><div class="n">#${i + 1}</div><div class="nm">${esc(e.name)}</div>
      <button class="sm" data-act="up" data-id="${esc(e.id)}" ${i === 0 ? "disabled" : ""}>↑</button>
      <button class="sm" data-act="down" data-id="${esc(e.id)}" ${i === list.length - 1 ? "disabled" : ""}>↓</button>
      <button class="sm" data-act="top" data-id="${esc(e.id)}" ${i === 0 ? "disabled" : ""}>Top</button>
      ${rk === "main" ? `<button class="sm bad" data-act="rmMain" data-id="${esc(e.id)}">Remove</button>` : ""}
    </div>`).join("") || `<p class="hint">No one in this list yet.</p>`;
  return html;
}

function vApplications(){
  return `<div class="inline"><div><h2>Editor applications</h2><p class="hint" style="margin:5px 0 0">Review submissions here without changing public rankings.</p></div><button data-act="refreshApplications">Refresh applications</button><select id="applicationFilter" aria-label="Filter applications" style="max-width:190px"><option value="all">All statuses</option><option value="pending">Pending review</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select></div><p id="applicationNotice" class="hint" role="status">Loading applications…</p><div id="applicationList"></div><div class="inline"><button data-act="previousApplications" disabled>Previous page</button><button data-act="nextApplications" disabled>Next page</button></div>`;
}
function updatePagination(kind, offset, total, loading = false){
  const previous = $('[data-act="previous' + kind + '"]');
  const next = $('[data-act="next' + kind + '"]');
  if(previous)previous.disabled = loading || offset === 0;
  if(next)next.disabled = loading || offset + 50 >= total;
}
let applicationsCache = [], applicationOffset=0, applicationTotal=0;
const applicationDrafts = new Map();
async function loadApplications(quiet=false){
  const notice = $("#applicationNotice"), list = $("#applicationList");
  if (!notice || !list) return;
  const offset=applicationOffset;
  if(!quiet)updatePagination("Applications",applicationOffset,applicationTotal,true);
  notice.className = "hint";
  if(!quiet){notice.textContent = "Loading applications…";list.innerHTML = "";}
  let result;try{result=await api("/api/applications/admin",{action:"list",offset:applicationOffset})}catch{notice.className="hint status bad";notice.textContent="Could not reach the server. Refresh to retry.";return}
  if($("#applicationNotice")!==notice||offset!==applicationOffset)return;
  const {ok,status,j}=result;
  if (!ok) { notice.className = "hint status bad"; notice.textContent = status === 401 ? "Session expired. Please log in again." : (j.error || "Could not load applications."); list.innerHTML = ""; return; }
  const unchanged=JSON.stringify(applicationsCache)===JSON.stringify(j.applications||[]) && applicationTotal===(j.total||0);
  applicationsCache = j.applications || []; applicationTotal=j.total||0;
  notice.className = "hint"; notice.textContent = applicationsCache.length + " applications on this page, " + applicationTotal + " total.";

let pictureFetchRunning = false;
function isLegacyBlobPicture(value) {
  try {
    const url = new URL(value);
    return url.protocol === "https:" && /^[a-z0-9-]+\.(?:public|private)\.blob\.vercel-storage\.com$/i.test(url.hostname);
  } catch { return false; }
}
const ttUser = e => String(e.tiktok || "").replace(/^@/, "").trim();

}, true);

async function fetchOne(i){
  const e = S.editors[i];
  const username=ttUser(e),previous=e.thumb;
  if (!username) return "no TikTok username";
  try {
    const { ok, status, j } = await api("/api/avatar", {editorId:e.id,username});
    if (ok && j.url) {
      if(!S.editors.includes(e)||e.thumb!==previous||ttUser(e)!==username)return "profile changed during the fetch; the current picture is kept";
      e.thumb = j.url; save(); return "";
    }
    if (status === 401) return "session expired – log in again";
    return j.error || "failed";
  } catch (err) { return "couldn't reach the server"; }
}

async function runFetch(idx, replaceLegacy = false){
  if(pictureFetchRunning)return setStatus("A picture fetch is already running.");
  if(replaceLegacy && (!ONLINE || !can("list_contributor")))return setStatus("List Contributor access is required.","bad");
  if(replaceLegacy){
    await autosave.flush();
    if(pictureFetchRunning)return setStatus("A picture fetch is already running.");
    if(autosave.dirty||autosave.blocked)return setStatus("Resolve unsaved changes before replacing pictures.","bad");
  }
  const todo = idx === null
    ? S.editors.filter(e => replaceLegacy ? isLegacyBlobPicture(e.thumb) : ttUser(e) && !e.thumb).map(e=>e.id)
    : [S.editors[idx]?.id];
  if (!todo.length) return setStatus(replaceLegacy?"No Vercel pictures remain.":"Nothing to fetch (add TikTok usernames first)");
  pictureFetchRunning=true;
  document.querySelectorAll('[data-act="fetchPic"],[data-act="fetchAll"],[data-act="fetchLegacy"]').forEach(button=>{button.disabled=true});
  const fails = [];let fetched=0,stopped=false;
  try{
    for (let n = 0; n < todo.length; n++) {
      setStatus(`Fetching pictures… ${n + 1}/${todo.length}`);
      const currentIndex=S.editors.findIndex(e=>e.id===todo[n]);
      if(currentIndex<0){fails.push(`${todo[n]}: profile no longer exists`);continue}
      const editor=S.editors[currentIndex],previous=editor.thumb;
      const err = await fetchOne(currentIndex);
      if (err) fails.push(`${editor.name}: ${err}`);
      else if(replaceLegacy){
        // Do not retire a Blob URL until its replacement is saved with the current revision.
        await autosave.flush();
        if(autosave.dirty||autosave.blocked){
          editor.thumb=previous;save();
          fails.push(`${editor.name}: replacement could not be saved; the old picture is kept`);
          stopped=true;break;
        }
        fetched++;
      }else fetched++;
      if (n < todo.length - 1) await new Promise(r => setTimeout(r, 700));
    }
  }finally{pictureFetchRunning=false;view()}
  if (fails.length) {
    setStatus(`${fetched} pictures ${replaceLegacy?'replaced':'fetched'}, ${fails.length} failed${stopped?'; stopped before fetching more':''}`, "bad");
    alert("Couldn't fetch:\n\n" + fails.join("\n") + "\n\nExisting pictures are kept. Retry or paste a replacement URL by hand.");
  }
  else setStatus(replaceLegacy?`${fetched} Vercel pictures replaced and saved.`:"Pictures fetched. Changes save automatically.",replaceLegacy?"ok":"dirty");
}

const autosave = createAutosave({
  async write(){
    if(!S||!revision||!canEdit())throw new Error("Live rankings must load before saving.");
    const contributor=can("list_contributor"),profile=S.editors.find(e=>e.id===account.editor_id);
    const fields=["name","handle","tiktok","note","thumb","video","links","software"];
    const payload=contributor?{data:S,revision}:{profile:Object.fromEntries(fields.filter(k=>profile&&k in profile).map(k=>[k,profile[k]])),revision};
    const {ok,status,j}=await api(contributor?"/api/save":"/api/account/profile",structuredClone(payload));
    if(!ok)throw Object.assign(new Error(j.error||"Save failed."),{status});
    revision=j.revision;announceChange();
  },
  onState(state,error){
    dirty=autosave.dirty;
    if(state==="error")setStatus(error.message+(error.status===409?" Your edits are kept here. Use Discard changes to load the latest list.":" Use Save now to retry."),"bad");
    else setStatus({dirty:"Changes will save automatically…",saving:"Saving…",saved:"Saved. Live on the site."}[state],state==="saved"?"ok":"dirty");
    $("#saveSite").disabled=state==="saving"||!revision||autosave.blocked;
  }
});
$("#saveSite").addEventListener("click",()=>{if(!S||!revision)return setStatus("Live rankings must load before saving.","bad");void autosave.flush()});
$("#dl").addEventListener("click",()=>{
  if(!S||!can("list_contributor"))return;
  const url=URL.createObjectURL(new Blob(["window.SITE_DATA = "+JSON.stringify(S,null,2)+";\n"],{type:"text/javascript"}));
  const a=Object.assign(document.createElement("a"),{href:url,download:"rel-rankings-backup.js"});document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
});
$("#reset").addEventListener("click",async()=>{
  if(autosave.busy||pictureFetchRunning)return setStatus("Wait for your save or picture fetch to finish before reloading.");
  if(dirty&&!confirm("Discard unsaved changes and reload live rankings?"))return;
  autosave.pause();
  try{const next=await loadLive();autosave.reset();S=next;dirty=false;setStatus("");view()}catch(e){$("#saveSite").disabled=true;setStatus(e.message,"bad")}
});
(async()=>{
  try{sessionStorage.removeItem("adm_pw")}catch{}
  try{
    account=await getAccount();if(!account)return;
    if(!account.roles.some(role=>["owner","list_contributor","application_reviewer"].includes(role))){location.replace("/account/");return}
    try{S=await loadLive()}catch(e){S=null;revision=null;$("#banner").textContent=e.message}
    if(S)$("#banner").textContent=(account.username||"Member")+" · "+account.roles.map(role=>role==="member"?"Member":roleLabels[role]||role).join(", ")+(account.editor_id?" · Profile linked":" · No profile linked");
    $("#bootNotice").hidden=true;$("#ui").hidden=false;view();
    watchChanges(async()=>{
      const nextAccount=await getAccount();if(!nextAccount)return;
      if(!nextAccount.roles.some(role=>["owner","list_contributor","application_reviewer"].includes(role))){location.replace("/account/");return}
      const permissionsChanged=JSON.stringify(account.roles)!==JSON.stringify(nextAccount.roles)||account.editor_id!==nextAccount.editor_id;
      account=nextAccount;
      if(S)$("#banner").textContent=(account.username||"Member")+" · "+account.roles.map(role=>role==="member"?"Member":roleLabels[role]||role).join(", ");
      if(permissionsChanged){if(!can("list_contributor"))autosave.pause();view();return}
      if(tab==="editors"&&can("list_contributor"))await loadPending();
      const editing=$("#app").contains(document.activeElement)&&document.activeElement.matches("input,textarea,select");
      if(tab==="applications" && !applicationDrafts.size && !editing){await loadApplications(true);return}
      if(tab==="users" && !$("form[data-user][data-dirty],form[data-credit-user][data-dirty]") && !editing){await loadUsers(true);return}
      if(tab==="links"&&!editing){await loadProfileLinks(true);return}
      if(dirty||autosave.busy||editing||pictureFetchRunning)return;
      const response=await accountFetch("/api/account/site");if(!response.ok)return;
      const next=await response.json();if(!valid(next.data)||!next.revision)return;
      if(next.revision!==revision){S=next.data;revision=next.revision;view();setStatus("Updated from the live list.","ok")}
    });
  }catch(e){$("#bootNotice").textContent=e.message+" Reload to retry."}
})();
</script></body></html>
