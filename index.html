<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Roblox Editors</title>
    <meta
      name="description"
      content="Discover the Roblox editing community and explore our ranked list of editors."
    />
    <link rel="icon" type="image/svg+xml" href="media/icon.svg" />
    <meta name="theme-color" content="#050706" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap");
      :root {
        --bg: #050706;
        --panel: #0b100c;
        --panel-2: #111912;
        --line: #202a22;
        --text: #eef5ef;
        --text-2: #cdd9cf;
        --muted: #98a79b;
        --accent: #7af500;
        --on-accent: #061109;
        --font:
          "Red Hat Text", system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        --font-num:
          "Red Hat Text", system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--line) var(--panel);
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      .material-symbol {
        font-family: "Material Symbols Rounded";
        font-weight: normal;
        font-style: normal;
        font-size: 22px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        font-feature-settings: "liga";
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 16px;
        line-height: 1.45;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      a {
        color: inherit;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .wrap {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        padding: 0 16px;
      }

      /* header */
      .top {
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 60px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        min-width: 0;
        text-decoration: none;
        line-height: 1;
      }
      .brand img {
        display: block;
        width: auto;
        max-width: min(220px, 55vw);
        height: 34px;
        object-fit: contain;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 16px;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
        border-radius: 5px;
        white-space: nowrap;
      }
      .btn:hover {
        background: #8cfb14;
      }

      /* entrance animation */
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .hero {
        animation: fadeIn 300ms ease-out both;
        padding: 68px 0 52px;
        text-align: center;
      }
      .eyebrow {
        display: inline-block;
        margin-bottom: 14px;
        color: var(--accent);
        font-family: var(--font-num);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        font-family: var(--font-num);
        font-weight: 700;
        font-size: clamp(32px, 7vw, 54px);
        line-height: 1.05;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        overflow-wrap: anywhere;
        max-width: 720px;
        margin: 0 auto;
      }
      .intro {
        color: var(--muted);
        margin: 18px auto 24px;
        max-width: 54ch;
        font-size: 17px;
      }
      .arrow {
        margin-left: 6px;
        line-height: 1;
      }

      /* sections */
      .section {
        padding: 34px 0 56px;
        border-top: 1px solid var(--line);
      }
      .section-heading {
        margin-bottom: 20px;
      }
      h2 {
        font-family: var(--font-num);
        font-weight: 700;
        font-size: clamp(22px, 4vw, 28px);
        text-transform: uppercase;
      }

      /* contributors grid */
      .contributors {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .contributor {
        display: flex;
        align-items: center;
        min-width: 0;
        padding: 20px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        color: inherit;
        text-decoration: none;
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background 180ms ease;
      }
      .contributor:hover {
        border-color: var(--accent);
        transform: translateY(-2px) scale(1.05);
        position: relative;
        z-index: 1;
      }
      .contributor:first-child {
        grid-column: 1 / -1;
      }
      .person {
        min-width: 0;
      }
      .person-name {
        display: block;
        font-family: var(--font-num);
        font-weight: 700;
        font-size: 16px;
        overflow-wrap: anywhere;
      }
      .contribution {
        display: block;
        margin-top: 4px;
        color: var(--text-2);
        font-size: 13px;
        line-height: 1.4;
      }

      /* footer */
      .foot {
        margin-top: auto;
        border-top: 1px solid var(--line);
        padding: 22px 0 30px;
        color: var(--muted);
        font-size: 14px;
      }
      .foot .wrap {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px 24px;
      }
      .foot a {
        color: var(--text);
        text-underline-offset: 3px;
      }

      @media (max-width: 560px) {
        .contributors {
          grid-template-columns: 1fr;
        }
        .contributor:hover {
          transform: none !important;
        }
        .hero {
          padding: 48px 0 36px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="wrap bar">
        <a class="brand" id="brand" href="/" aria-label="Roblox Funk Editors"
          ><img src="media/logo.svg" alt="Roblox Funk Editors"
        /></a>
        <a class="btn" href="list/">View rankings</a>
      </div>
    </header>

    <main class="wrap">
      <section class="hero">
        <h1>Welcome to the Roblox Editor List</h1>
        <p class="intro">
          Discover the editors behind the style. Explore our ranked list of
          editors, with separate rankings for each editing style.
        </p>
        <a class="btn" href="list/">
          View rankings
          <span class="material-symbol arrow" aria-hidden="true"
            >arrow_forward</span
          >
        </a>
      </section>

      <section class="section">
        <div class="section-heading">
          <h2>The contributors</h2>
        </div>
        <div class="contributors" id="contributors"></div>
      </section>
    </main>

    <footer class="foot">
      <div class="wrap">
        <p id="footNote">Rankings are one person's opinion.</p>
        <p id="footCta"></p>
      </div>
    </footer>

    <script src="data.js"></script>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script>
      (function () {
        "use strict";

        var $ = function (s, r) {
          return (r || document).querySelector(s);
        };
        var esc = function (s) {
          return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c];
          });
        };

        var contributors = [
          {
            name: "@seeshaun",
            contribution: "Website owner.",
          },
          {
            name: "@balloond",
            contribution: "Dev - UI/UX designer.",
          },
          {
            name: "@b.luff",
            contribution: "Admin - top list contributor.",
          },
          {
            name: "@maxx.vfxs",
            contribution: "List contributor.",
          },
        ];

        $("#contributors").innerHTML = contributors
          .map(function (person) {
            var content =
              '<span class="person"><span class="person-name">' +
              esc(person.name) +
              '</span><span class="contribution">' +
              esc(person.contribution) +
              "</span></span>";

            return person.url
              ? '<a class="contributor" href="' +
                  esc(person.url) +
                  '" target="_blank" rel="noopener noreferrer">' +
                  content +
                  "</a>"
              : '<div class="contributor">' + content + "</div>";
          })
          .join("");

        var site = window.SITE_DATA && window.SITE_DATA.site;
        if (site) {
          document.title = site.title || "Roblox Funk Editors";
          var brandImg = $("#brand img");
          if (brandImg) brandImg.alt = site.title || "Roblox Funk Editors";

          var updated = String(site.updated || "").trim();
          $("#footNote").textContent =
            "Rankings are one person's opinion." +
            (updated ? " Last updated " + updated + "." : "");

          var username = String(site.tiktok || "")
            .replace(/^@/, "")
            .trim();
          var contact = String(site.contact || "").trim();
          var url = "";
          var label = "";

          if (/^[A-Za-z0-9._]{1,40}$/.test(username)) {
            url = "https://www.tiktok.com/@" + username;
            label = "DM @" + username + " on TikTok";
          } else if (
            /^(https?:\/\/|mailto:)/i.test(contact) &&
            !/example\.com/i.test(contact)
          ) {
            url = contact;
            label = "Get in touch";
          }

          if (url) {
            var link = document.createElement("a");
            link.href = url;
            link.textContent = label;
            if (/^https?:\/\//i.test(url)) {
              link.target = "_blank";
              link.rel = "noopener noreferrer";
            }
            var cta = $("#footCta");
            if (cta) {
              cta.append("Disagree with a placement? ", link, ".");
            }
          }
        }
      })();
    </script>
  </body>
</html>
