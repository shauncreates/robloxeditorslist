<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Roblox Editors</title>
    <meta
      name="description"
      content="Discover the Roblox editing community and explore our ranked list of editors."
    />
    <link rel="icon" type="image/svg+xml" href="media/icon.svg" />
    <meta name="theme-color" content="#050706" />
    <link rel="stylesheet" href="assets/typography.css" />
    <link rel="stylesheet" href="assets/actions.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap");
      :root {
        --bg: #050706;
        --panel: #0b100c;
        --panel-2: #111912;
        --line: #202a22;
        --text: #eef5ef;
        --text-2: #cdd9cf;
        --muted: #98a79b;
        --accent: #7af500;
        --on-accent: #061109;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--line) var(--panel);
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      .material-symbol {
        font-family: "Material Symbols Rounded";
        font-weight: normal;
        font-style: normal;
        font-size: 22px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        font-feature-settings: "liga";
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 16px;
        line-height: 1.45;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      a {
        color: inherit;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .wrap {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        padding: 0 16px;
      }

      /* header */
      .top {
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 60px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        min-width: 0;
        text-decoration: none;
        line-height: 1;
      }
      .brand img {
        display: block;
        width: auto;
        max-width: min(220px, 55vw);
        height: 34px;
        object-fit: contain;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 16px;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
        border-radius: 5px;
        white-space: nowrap;
      }
      .btn:hover {
        background: #8cfb14;
      }

      /* entrance animation */
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .hero {
        animation: fadeIn 300ms ease-out both;
        padding: 68px 0 52px;
        text-align: center;
      }
      .eyebrow {
        display: inline-block;
        margin-bottom: 14px;
        color: var(--accent);
        font-family: var(--font-num);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        font-family: var(--font-num);
        font-weight: 700;
        font-size: clamp(32px, 7vw, 54px);
        line-height: 1.05;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        overflow-wrap: anywhere;
        max-width: 720px;
        margin: 0 auto;
      }
      .intro {
        color: var(--muted);
        margin: 18px auto 24px;
        max-width: 54ch;
        font-size: 17px;
      }
      .hero-actions {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }
      .hero-actions .btn { gap: 9px; }
      .bar { padding-block: 8px; }
      .bar .brand img { max-width: min(160px, 28vw); }
      .bar .rel-action { font-size:14px;padding-inline:12px;white-space:nowrap; }
      .arrow {
        margin-left: 6px;
        line-height: 1;
      }

      /* sections */
      .section {
        padding: 34px 0 56px;
        border-top: 1px solid var(--line);
      }
      .section-heading {
        margin-bottom: 20px;
      }
      h2 {
        font-family: var(--font-num);
        font-weight: 700;
        font-size: clamp(22px, 4vw, 28px);
        text-transform: uppercase;
      }

      .contributors {
        display: grid;
        gap: 12px;
      }
      .contributor-tier {
        display: grid;
        gap: 14px;
        min-width: 0;
        padding: 18px 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
      }
      .tier-heading {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 17px;
        font-weight: 700;
      }
      .tier-heading .rel-icon { color: var(--muted); }
      .tier-owners { border-color: #385c22; background: #0e180b; }
      .tier-owners .tier-heading { color: var(--accent); }
      .tier-owners .tier-heading .rel-icon { color: inherit; }
      .tier-members {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .contributor {
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 44px;
        min-width: 0;
        max-width: 100%;
        padding: 10px 12px;
        background: var(--panel-2);
        border: 1px solid #68796b;
        border-radius: 8px;
        color: inherit;
        text-decoration: none;
        transition:
          border-color 180ms ease,
          background 180ms ease;
      }
      .contributor:hover,.contributor:focus-visible {
        border-color: var(--accent);
        position: relative;
        z-index: 1;
      }
      .contributor>.rel-icon{color:var(--accent);transition:transform 180ms ease}
      .contributor:hover>.rel-icon,.contributor:focus-visible>.rel-icon{transform:translateX(3px)}
      @media(prefers-reduced-motion:reduce){.contributor>.rel-icon{transition:none}.contributor:hover,.contributor:focus-visible,.contributor:hover>.rel-icon,.contributor:focus-visible>.rel-icon{transform:none}}
      .person-name {
        display: block;
        font-family: var(--font-num);
        font-weight: 700;
        font-size: 16px;
        overflow-wrap: anywhere;
      }
      .tier-empty { color: var(--muted); font-size: 14px; }
      @media(min-width:620px){.contributor-tier{grid-template-columns:160px minmax(0,1fr);align-items:center;padding:20px}}
      @media(min-width:850px){.contributor-tier{grid-template-columns:180px minmax(0,1fr);gap:24px;padding:22px 24px}}

      /* footer */
      .foot {
        margin-top: auto;
        border-top: 1px solid var(--line);
        padding: 22px 0 30px;
        color: var(--muted);
        font-size: 14px;
      }
      .foot .wrap {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px 24px;
      }
      .foot a {
        color: var(--text);
        text-underline-offset: 3px;
      }

      @media (max-width: 560px) {
        .contributor:hover {
          transform: none !important;
        }
        .hero {
          padding: 48px 0 36px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="wrap bar">
        <a class="brand" id="brand" href="/" aria-label="Roblox Funk Editors"
          ><img src="media/logo.svg" alt="Roblox Funk Editors"
        /></a>
        <a class="rel-action rel-action--account" href="/signin/"><svg class="rel-icon" aria-hidden="true"><use href="/media/action-icons.svg#account"/></svg><span>Sign in / Sign up</span></a>
      </div>
    </header>

    <main class="wrap">
      <section class="hero">
        <h1>Welcome to the Roblox Editor List</h1>
        <p class="intro">
          Discover the editors behind the style. Explore our ranked list of
          editors, with separate rankings for each editing style.
        </p>
        <div class="hero-actions">
          <a class="btn" href="list/"><svg class="rel-icon" aria-hidden="true"><use href="/media/action-icons.svg#rankings"/></svg><span>View rankings</span></a>
          <a class="rel-action" href="/apply/" aria-label="Apply"><svg class="rel-icon" aria-hidden="true"><use href="/media/action-icons.svg#applications"/></svg><span>Apply</span></a>
        </div>
      </section>

      <section class="section">
        <div class="section-heading">
          <h2>The contributors</h2>
        </div>
        <div class="contributors" id="contributors"><p class="tier-empty" role="status">Loading contributors…</p></div>
        <noscript><p>Enable JavaScript to view contributors.</p></noscript>
      </section>
    </main>

    <footer class="foot">
      <div class="wrap">
        <p id="footNote">Rankings are one person's opinion.</p>
        <p id="footCta"></p>
        <a class="rel-text-link" href="/changelog/">Changelog<svg class="rel-icon" aria-hidden="true"><use href="/media/action-icons.svg#arrow"/></svg></a>
      </div>
    </footer>

    <script src="data.js"></script>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script>
      (async function () {
        "use strict";

        var $ = function (s, r) {
          return (r || document).querySelector(s);
        };
        var esc = function (s) {
          return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c];
          });
        };

        var site;
        if (/^https?:$/.test(location.protocol)) {
          try {
            var response = await fetch("/api/data", { cache: "no-store" });
            if (!response.ok) throw new Error("Rankings unavailable");
            var live = await response.json();
            site = live && live.site;
          } catch (error) {
            $("#footNote").textContent = "Live ranking information is temporarily unavailable.";
          }
        } else {
          site = window.SITE_DATA && window.SITE_DATA.site;
        }
        if (site) {
          document.title = site.title || "Roblox Funk Editors";
          var brandImg = $("#brand img");
          if (brandImg) brandImg.alt = site.title || "Roblox Funk Editors";

          var updated = String(site.updated || "").trim();
          $("#footNote").textContent =
            "Rankings are one person's opinion." +
            (updated ? " Last updated " + updated + "." : "");

          var username = String(site.tiktok || "")
            .replace(/^@/, "")
            .trim();
          var contact = String(site.contact || "").trim();
          var url = "";
          var label = "";

          if (/^[A-Za-z0-9._]{1,40}$/.test(username)) {
            url = "https://www.tiktok.com/@" + username;
            label = "DM @" + username + " on TikTok";
          } else if (
            /^(https?:\/\/|mailto:)/i.test(contact) &&
            !/example\.com/i.test(contact)
          ) {
            url = contact;
            label = "Get in touch";
          }

          if (url) {
            var link = document.createElement("a");
            link.href = url;
            link.textContent = label;
            if (/^https?:\/\//i.test(url)) {
              link.target = "_blank";
              link.rel = "noopener noreferrer";
            }
            var cta = $("#footCta");
            if (cta) {
              cta.append("Disagree with a placement? ", link, ".");
            }
          }
        }
      })();
    </script>
    <script type="module" src="assets/contributors.js"></script>
  </body>
</html>
