<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
  <title>Email confirmation | Roblox Editors</title>
  <link rel="icon" type="image/svg+xml" href="../media/icon.svg">
  <link rel="stylesheet" href="../assets/typography.css">
  <link rel="stylesheet" href="../assets/account.css">
</head>
<body><main class="account-wrap">
  <a class="rel-brand" href="/" aria-label="Roblox Editors List home"><img src="../media/logo.svg" alt="Roblox Editors List"></a>
  <div id="confirmation" role="status" aria-live="polite" aria-busy="true">
    <h1 id="title">Checking your email…</h1>
    <p id="message">Please wait while we check your email confirmation.</p>
  </div>
  <a class="primary-link" href="/signin/">Go back to sign in</a>
  <noscript><p>JavaScript is needed to show the confirmation status. Return to sign-in to check your account.</p></noscript>
</main>
<script type="module" src="../assets/email-verified.js"></script>
</body></html>
