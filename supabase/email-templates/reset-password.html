<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset your REL password</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&amp;display=swap">
</head>
<body style="margin:0;background:#050706;color:#eef5ef;font-family:'Red Hat Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.6;padding:20px">
  <main style="max-width:560px;margin:auto;background:#0b100c;border:1px solid #202a22;border-radius:12px;padding:28px">
    <a href="{{ .SiteURL }}" aria-label="Roblox Editors List home"><img src="https://robloxeditors.com/media/logo.svg" width="120" alt="Roblox Editors List" style="display:block;width:120px;max-width:100%;height:auto;border:0"></a>
    <h1 style="font-size:26px">Reset your password</h1>
    <p>Enter this recovery code on the Roblox Editors List password reset page:</p>
    <p style="font-size:28px;font-weight:bold">{{ .Token }}</p>
    <p><a href="{{ .RedirectTo }}" style="color:#7af500">Open the password reset page</a></p>
    <p>Use the code once. If it expires, request another code.</p>
    <p style="color:#98a79b;font-size:14px">If you did not request a password reset, ignore this email. Your password will stay the same.</p>
  </main>
</body></html>
