<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>My account | Roblox Editors</title>
  <link rel="stylesheet" href="../assets/typography.css">
  <link rel="stylesheet" href="../assets/account.css">
  <link rel="stylesheet" href="../assets/profile.css">
  <link rel="stylesheet" href="../assets/actions.css">
  <script type="module" src="../assets/action-buttons.js"></script>
  <style>
    [hidden]{display:none!important}
    .account-wrap{max-width:760px;margin:24px auto}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:28px}
    header nav{display:flex;align-items:center;gap:16px;flex-wrap:wrap}header button{margin:0}
    header a{display:inline-flex;align-items:center;min-height:44px}
    .card{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-top:18px;overflow-wrap:anywhere}
    summary{display:flex;align-items:center;font-weight:700;cursor:pointer;min-height:48px}
    .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px;min-width:0}
    select,textarea{width:100%;font:inherit;color:var(--text);background:var(--panel);border:1px solid #68796b;border-radius:8px;padding:12px;min-height:44px}
    textarea{min-height:100px;resize:vertical}input,select,textarea{min-width:0}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}.bad{color:#ff7373}
    #identity,#status{overflow-wrap:anywhere}#status{min-height:26px}
    @media(max-width:560px){.two{grid-template-columns:1fr}header nav{flex-basis:100%}}
  </style>
</head>
<body><main class="account-wrap">
  <header><a class="rel-brand" href="/" aria-label="Roblox Editors List home"><img src="../media/logo.svg" alt="Roblox Editors List"></a><nav aria-label="Account navigation"><a class="rel-action rel-action--reveal" href="/list/" aria-label="View rankings"><svg class="rel-icon" aria-hidden="true"><use href="/media/action-icons.svg#rankings"/></svg><span>View rankings</span></a><a class="rel-action rel-action--reveal" id="manage" href="/admin/" aria-label="Manage REL" hidden><svg class="rel-icon" aria-hidden="true"><use href="/media/action-icons.svg#manage"/></svg><span>Manage REL</span></a><button class="rel-action rel-action--reveal" id="signout" type="button" aria-label="Sign out" hidden><svg class="rel-icon" aria-hidden="true"><use href="/media/action-icons.svg#signout"/></svg><span>Sign out</span></button></nav></header>
  <h1>My account</h1><p id="identity" class="hint"></p><a id="publicProfileLink" class="account-link rel-text-link" hidden><span>View public profile</span><svg class="rel-icon" aria-hidden="true"><use href="/media/action-icons.svg#arrow"/></svg></a>
  <form id="usernameForm" hidden><label for="accountUsername">Username</label><input id="accountUsername" minlength="3" maxlength="40" pattern="[A-Za-z0-9][A-Za-z0-9_\-]{2,39}" required autocomplete="nickname" autocapitalize="none" spellcheck="false" aria-describedby="usernameHint usernameAvailability"><p class="hint" id="usernameHint">Use 3 to 40 letters, digits, underscores or hyphens, starting with a letter or digit. Stored in lowercase. Reviews show your username; sign-in still uses your email.</p><p class="hint" id="usernameAvailability" role="status"></p><button data-icon="save" type="submit">Save username</button></form><p id="usernameNotice" role="status"></p>
  <p id="status" role="status">Loading your account…</p><div id="profile"></div>
</main><script type="module" src="../assets/profile-page.js"></script></body>
</html>
