<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />

    <title>Reset password | Roblox Editors</title>

    <link rel="stylesheet" href="../assets/typography.css" />
    <link rel="stylesheet" href="../assets/account.css" />
    <link rel="stylesheet" href="../assets/actions.css" />

    <script type="module" src="../assets/action-buttons.js"></script>
  </head>

  <body class="account-page">
    <main class="account-wrap">
      <a class="rel-brand" href="/" aria-label="Roblox Editors List home">
        <img src="../media/logo.svg" alt="Roblox Editors List" />
      </a>

      <h1>Reset password</h1>

      <form id="resetForm">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          required
          maxlength="254"
          autocomplete="username"
        />

        <fieldset class="recovery-fields" id="recoveryFields" hidden disabled>
          <label for="code">Recovery code</label>

          <input
            id="code"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            pattern="[0-9]{6}"
            minlength="6"
            maxlength="6"
            required
            aria-describedby="codeHint"
          />

          <p class="hint" id="codeHint">
            Enter the six-digit code from your recovery email.
          </p>

          <label for="password">New password</label>

          <input
            id="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            maxlength="1024"
            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,1024}"
            required
            aria-describedby="passwordHint"
          />

          <p class="hint" id="passwordHint">
            Use at least 8 characters, including an uppercase letter, a
            lowercase letter and a digit.
          </p>

          <label for="confirmPassword">Confirm new password</label>

          <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
            maxlength="1024"
            required
          />
        </fieldset>

        <button class="pri" data-icon="key" id="submit">
          Send recovery code
        </button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>

      <nav
        class="account-secondary-links"
        id="recoveryActions"
        aria-label="Recovery options"
      >
        <a class="account-text-action" href="/signin/">Back to sign in</a>

        <button
          id="haveCode"
          type="button"
          class="account-text-action"
          data-no-icon
        >
          I already have a code
        </button>

        <button
          id="resend"
          type="button"
          class="account-text-action"
          data-no-icon
          hidden
        >
          Send another code
        </button>

        <button
          id="changeEmail"
          type="button"
          class="account-text-action"
          data-no-icon
          hidden
        >
          Change email
        </button>
      </nav>
    </main>

    <script type="module" src="../assets/password-reset.js"></script>
  </body>
</html>
