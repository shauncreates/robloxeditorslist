<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Roblox Editors</title>
    <meta
      name="description"
      content="Discover the Roblox editing community and explore our ranked list of editors."
    />
    <link rel="icon" type="image/svg+xml" href="../media/icon.svg" />
    <meta name="theme-color" content="#050706" />
    <link rel="stylesheet" href="../assets/typography.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap");
      :root {
        --bg: #050706;
        --panel: #0b100c;
        --panel-2: #111912;
        --line: #202a22;
        --text: #eef5ef;
        --text-2: #cdd9cf;
        --muted: #98a79b;
        --accent: #7af500;
        --on-accent: #061109;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--line) var(--panel);
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      .material-symbol {
        font-family: "Material Symbols Rounded";
        font-weight: normal;
        font-style: normal;
        font-size: 22px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        font-feature-settings: "liga";
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 16px;
        line-height: 1.45;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      body.lock {
        overflow: hidden;
      }
      a {
        color: inherit;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .wrap {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        padding: 0 16px;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .skip {
        position: absolute;
        left: 8px;
        top: -60px;
        background: var(--accent);
        color: var(--on-accent);
        padding: 10px 14px;
        border-radius: 5px;
        font-weight: 600;
        text-decoration: none;
        z-index: 30;
      }
      .skip:focus {
        top: 8px;
      }

      /* header */
      .top {
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 60px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        min-width: 0;
        text-decoration: none;
        line-height: 1;
      }
      .brand img {
        display: block;
        width: auto;
        max-width: min(220px, 55vw);
        height: 34px;
        object-fit: contain;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 16px;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
        border-radius: 5px;
        white-space: nowrap;
      }
      .btn:hover {
        background: #8cfb14;
      }
      .btn .short {
        display: none;
      }

      /* entrance animations */
      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .hero {
        animation: fadeInDown 420ms ease-out both;
      }
      .row {
        animation: fadeInUp 360ms ease-out both;
      }
      .list.searching .row {
        animation: none;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-delay: 0ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* hero */
      .hero {
        padding: 34px 0 6px;
        text-align: center;
      }
      .hero .sub {
        margin-left: auto;
        margin-right: auto;
      }
      h1 {
        font-family: var(--font-num);
        font-weight: 700;
        font-size: clamp(36px, 8vw, 58px);
        line-height: 1;
        text-transform: uppercase;
        letter-spacing: 0.01em;
        overflow-wrap: anywhere;
      }
      .sub {
        color: var(--muted);
        margin-top: 10px;
        max-width: 60ch;
      }

      /* tabs */
      .tabs {
        display: flex;
        gap: 2px;
        overflow-x: auto;
        overflow-y: hidden;
        overscroll-behavior-x: contain;
        touch-action: pan-x;
        border-bottom: 1px solid var(--line);
        margin-top: 22px;
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar {
        display: none;
      }
      .tab {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 46px;
        padding: 0 16px;
        font-family: var(--font-num);
        font-weight: 600;
        font-size: 18px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: var(--muted);
        text-decoration: none;
      }
      .tab:hover {
        color: var(--text);
      }
      .tab[aria-current="page"] {
        color: var(--text);
      }
      .tabs {
        position: relative;
      }
      .tabs::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: var(--underline-left, 0px);
        width: var(--underline-width, 0px);
        height: 3px;
        background: var(--underline-color, var(--accent));
        transition:
          left 220ms ease,
          width 220ms ease;
        pointer-events: none;
      }
      .tabs.no-transition::after {
        transition: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .tabs::after {
          transition: none;
        }
      }
      .tab .n {
        font-family: var(--font);
        font-weight: 500;
        font-size: 13px;
        color: var(--muted);
      }

      /* search */
      .controls {
        display: flex;
        align-items: center;
        margin: 18px 0 14px;
      }
      .search-wrap {
        position: relative;
        flex: 1;
        min-width: 0;
      }
      .controls input {
        display: block;
        width: 100%;
        min-width: 0;
        height: 44px;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0 76px 0 42px;
        font: inherit;
        box-sizing: border-box;
      }
      .controls input::placeholder {
        color: var(--muted);
        opacity: 1;
      }
      .controls input:focus-visible {
        outline-offset: 0;
        border-color: var(--accent);
      }
      .controls input[type="search"]::-webkit-search-cancel-button {
        display: none;
      }
      .search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 17px;
        height: 17px;
        color: var(--muted);
        pointer-events: none;
      }
      .count {
        position: absolute;
        right: 13px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        pointer-events: none;
      }

      /* list */
      .list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-bottom: 56px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: stretch;
        flex-wrap: wrap;
      }
      .main {
        --rankw: 50px;
        --av: 55px;
        flex: 1 1 0;
        min-width: 0;
        width: 100%;
        display: grid;
        grid-template-columns: var(--rankw) var(--av) minmax(0, 1fr) auto;
        grid-template-areas:
          "rank av who go"
          ". . tags tags";
        align-items: center;
        gap: 8px 12px;
        padding: 12px 16px 12px 8px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        color: inherit;
        text-decoration: none;
        text-align: left;
        transition:
          transform 180ms ease,
          border-color 180ms ease;
      }
      .main:hover {
        border-color: var(--accent);
        background: var(--panel-2);
      }
      .rank {
        grid-area: rank;
        font-family: var(--font-num);
        font-weight: 700;
        font-size: 26px;
        line-height: 1;
        text-align: center;
        color: var(--text-2);
        font-variant-numeric: tabular-nums;
      }
      .av {
        grid-area: av;
        width: var(--av);
        height: var(--av);
        border-radius: 50%;
        background: var(--panel-2);
        border: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-num);
        font-weight: 700;
        font-size: calc(var(--av) * 0.5);
        color: var(--text-2);
        overflow: hidden;
        flex: none;
      }
      .av img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .who {
        grid-area: who;
        min-width: 0;
      }
      .nm {
        display: block;
        font-family: var(--font-num);
        font-weight: 700;
        font-size: 22px;
        line-height: 1.15;
        overflow-wrap: anywhere;
      }
      .hd {
        width: fit-content;
        display: block;
        color: var(--muted);
        font-size: 14px;
        overflow-wrap: anywhere;
      }
      .tags {
        grid-area: tags;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: flex-start;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 32px;
        padding: 0 9px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 5px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-2);
        white-space: nowrap;
      }
      .tag .sw {
        width: 8px;
        height: 8px;
        border-radius: 5px;
        flex: none;
      }
      .profile-action {
        grid-area: go;
        width: 36px;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        background: var(--panel-2);
        color: var(--text-2);
        border: 1px solid var(--line);
        border-radius: 5px;
        font: inherit;
        font-size: 22px;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
      }
      .profile-action:hover {
        color: var(--text);
        border-color: var(--accent);
      }
      .handle-link {
        color: var(--muted);
        text-decoration: none;
        overflow-wrap: anywhere;
      }
      .handle-link:hover {
        color: var(--text);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .external-mark {
        display: inline-block;
        margin-left: 4px;
        font-size: 0.9em;
        color: var(--muted);
      }

      /* Highlight the top three ranks */
      .t1 .main,
      .t2 .main,
      .t3 .main {
        --rankw: 55px;
        --av: 65px;
      }
      .t1 .main {
        padding-block: 14px;
        background: linear-gradient(
          100deg,
          rgba(212, 175, 55, 0.16),
          rgba(212, 175, 55, 0.055)
        );
        border-color: rgba(212, 175, 55, 0.55);
      }
      .t2 .main {
        background: linear-gradient(
          100deg,
          rgba(192, 192, 192, 0.13),
          rgba(192, 192, 192, 0.035)
        );
        border-color: rgba(192, 192, 192, 0.4);
      }
      .t3 .main {
        background: linear-gradient(
          100deg,
          rgba(205, 127, 50, 0.14),
          rgba(205, 127, 50, 0.04)
        );
        border-color: rgba(205, 127, 50, 0.45);
      }
      .t1 .rank {
        font-size: 34px;
        color: #d4af37;
      }
      .t2 .rank {
        font-size: 30px;
        color: #c0c0c0;
      }
      .t3 .rank {
        font-size: 30px;
        color: #cd7f32;
      }
      .t1 .nm {
        font-size: 28px;
      }
      .t2 .main,
      .t3 .main {
        padding-block: 12px;
      }
      .t2 .nm,
      .t3 .nm {
        font-size: 26px;
      }

      /* states */
      .sk .main {
        pointer-events: none;
      }
      .sk .bar1,
      .sk .bar2 {
        display: block;
        height: 14px;
        background: var(--panel-2);
        border-radius: 5px;
      }
      .sk .bar1 {
        width: 42%;
        height: 18px;
      }
      .sk .bar2 {
        width: 24%;
        margin-top: 8px;
      }
      .sk .av {
        border-style: dashed;
      }
      .state {
        padding: 48px 0;
        max-width: 46ch;
      }
      .state h2 {
        font-family: var(--font-num);
        font-weight: 700;
        font-size: 28px;
        text-transform: uppercase;
      }
      .state p {
        color: var(--muted);
        margin: 8px 0 18px;
      }
      .state .btn {
        border: 0;
      }
      .state .ghost {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--line);
      }
      .empty {
        text-align: center;
        padding: 24px 0;
        color: var(--muted);
      }

      /* profile drawer */
      dialog {
        border: 0;
        padding: 0;
        margin: 0 0 0 auto;
        width: min(460px, 100%);
        max-width: none;
        height: 100vh;
        height: 100dvh;
        max-height: none;
        background: var(--panel);
        color: var(--text);
        border-left: 1px solid var(--line);
        overflow: hidden;
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.65);
      }
      .d {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .d-head {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 18px;
        border-bottom: 1px solid var(--line);
      }
      .d-head .av {
        --av: 64px;
      }
      .d-head .t {
        flex: 1;
        min-width: 0;
      }
      .d-head h2 {
        font-family: var(--font-num);
        font-weight: 700;
        font-size: 24px;
        line-height: 1.1;
        overflow-wrap: anywhere;
      }
      .d-head .hd {
        margin-top: 2px;
      }
      .d-head .flares {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .x {
        width: 36px;
        height: 36px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 5px;
        align-self: flex-start;
      }
      .x:hover {
        border-color: var(--accent);
      }
      .d-body {
        flex: 1;
        overflow: auto;
        padding: 6px 18px 28px;
      }
      .d-body section {
        margin-top: 22px;
      }
      .d-body h3 {
        font-size: 15px;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .pl {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .pl a {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 44px;
        padding: 0 14px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 5px;
        text-decoration: none;
      }
      .pl a:hover {
        border-color: var(--accent);
      }
      .pl b {
        font-family: var(--font-num);
        font-size: 22px;
      }
      .note {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .vid {
        position: relative;
        aspect-ratio: 16/9;
        background: #000;
        border-radius: 5px;
        overflow: hidden;
      }
      .vid iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .ext {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .ext a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 16px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 5px;
        font-weight: 600;
        text-decoration: none;
      }
      .ext a.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }
      .ext a:hover {
        border-color: var(--accent);
      }

      /* footer */
      .foot {
        margin-top: auto;
        border-top: 1px solid var(--line);
        padding: 22px 0 30px;
        color: var(--muted);
        font-size: 14px;
      }
      .foot .wrap {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px 24px;
      }
      .foot a {
        color: var(--text);
        text-underline-offset: 3px;
      }

      @media (max-width: 640px) {
        #cta {
          min-width: 0;
          max-width: 60%;
          white-space: normal;
          text-align: center;
          padding: 6px 12px;
        }
        .brand img {
          height: 30px;
          max-width: min(180px, 52vw);
        }
        .btn .long {
          display: none;
        }
        .btn .short {
          display: inline;
        }
        .hero {
          padding-top: 24px;
        }
        .main,
        .t1 .main,
        .t2 .main,
        .t3 .main {
          grid-template-columns: var(--rankw) var(--av) minmax(0, 1fr) auto;
          grid-template-areas: "rank av who who" "tags tags tags go";
          gap: 10px 12px;
          padding-right: 12px;
        }
        .main,
        .t1 .main,
        .t2 .main,
        .t3 .main {
          --rankw: 52px;
          --av: 44px;
        }
        .rank {
          font-size: 22px;
        }
        .t1 .rank,
        .t2 .rank,
        .t3 .rank {
          font-size: 24px;
        }
        .nm {
          font-size: 18px;
        }
        .t1 .nm,
        .t2 .nm,
        .t3 .nm {
          font-size: 19px;
        }
        .tags {
          justify-content: flex-start;
        }
        .go {
          align-self: center;
        }
        .profile-action {
          width: 34px;
          height: 34px;
          font-size: 21px;
        }
        dialog {
          width: 100%;
          border-left: 0;
        }
        .d-head .av {
          --av: 52px;
        }
        .d-head .av {
          --av: 52px;
        }
      }

      @media (max-width: 380px) {
        .main,
        .t1 .main,
        .t2 .main,
        .t3 .main {
          --rankw: 38px;
          --av: 38px;
          gap: 8px;
          padding-left: 6px;
          padding-right: 8px;
        }
        .rank {
          font-size: 16px;
        }
        .t1 .rank,
        .t2 .rank,
        .t3 .rank {
          font-size: 18px;
        }
        .nm {
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .t1 .nm,
        .t2 .nm,
        .t3 .nm {
          font-size: 18px;
        }
      }

      /* Row hover effect */
      .main {
        transition:
          transform 180ms ease,
          border-color 180ms ease;
      }
      @media (hover: hover) {
        .main:hover {
          transform: translateY(-2px) scale(1.05);
          position: relative;
          z-index: 1;
        }
      }

      /* Drawer animations */
      @keyframes drawerIn {
        from {
          opacity: 0;
          transform: translateX(36px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @keyframes backdropIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      dialog[open] {
        animation: drawerIn 260ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      dialog[open]::backdrop {
        animation: backdropIn 260ms ease-out both;
      }

      @media (prefers-reduced-motion: reduce) {
        .main {
          transition: none;
        }
        .main:hover {
          transform: none;
        }
        dialog[open],
        dialog[open]::backdrop {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#list">Skip to the list</a>

    <header class="top">
      <div class="wrap bar">
        <a class="brand" id="brand" href="/" aria-label="Roblox Funk Editors"
          ><img src="../media/logo.svg" alt="Roblox Funk Editors"
        /></a>
        <a class="btn" id="cta" href="/apply/"
          ><span>Apply to Be on the List</span></a
        >
      </div>
    </header>

    <main class="wrap" id="app" aria-live="polite"></main>

    <footer class="foot">
      <div class="wrap">
        <p id="footNote"></p>
        <p id="footCta"></p>
      </div>
    </footer>

    <dialog id="drawer" aria-labelledby="dName"></dialog>

    <script src="../data.js"></script>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script>
      (function () {
        "use strict";

        var $ = function (s, r) {
          return (r || document).querySelector(s);
        };
        var esc = function (s) {
          return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c];
          });
        };
        var safeUrl = function (u) {
          return /^https?:\/\//i.test(u || "") ? u : "";
        };
        var HEX = /^#[0-9a-f]{3,8}$/i;
        var LABELS = {
          youtube: "YouTube",
          instagram: "Instagram",
          twitter: "X",
          discord: "Discord",
        };

        var D = null,
          byId = {},
          styleById = {},
          key = "main",
          query = "",
          hashBound = false;

        /* ---------- data helpers ---------- */
        var valid = function (d) {
          return (
            d &&
            d.site &&
            Array.isArray(d.styles) &&
            Array.isArray(d.editors) &&
            d.lists
          );
        };

        function members(k) {
          if (k === "main") {
            var seen = {};
            return (D.lists.main || [])
              .filter(function (id) {
                if (!byId[id] || seen[id]) return false;
                seen[id] = true;
                return true;
              })
              .map(function (id) {
                return byId[id];
              });
          }
          var order = D.lists[k] || [];
          var pos = function (id) {
            var i = order.indexOf(id);
            return i < 0 ? 1e9 : i;
          };
          return D.editors
            .filter(function (e) {
              return (e.flares || []).indexOf(k) > -1;
            })
            .sort(function (a, b) {
              return pos(a.id) - pos(b.id);
            });
        }
        function rankIn(e, k) {
          var m = members(k);
          for (var i = 0; i < m.length; i++) if (m[i].id === e.id) return i + 1;
          return 0;
        }
        function listName(k) {
          return k === "main"
            ? "Overall ranking"
            : styleById[k].name + " ranking";
        }

        function ttUser(e) {
          return String(e.tiktok || "")
            .replace(/^@/, "")
            .trim();
        }
        function ttUrl(e) {
          var u = ttUser(e);
          if (/^[A-Za-z0-9._]{1,40}$/.test(u))
            return "https://www.tiktok.com/@" + u;
          return safeUrl((e.links || {}).tiktok);
        }
        function shownHandle(e) {
          return e.handle || (ttUser(e) ? "@" + ttUser(e) : "");
        }
        function ytId(u) {
          var m = String(u || "").match(
            /(?:youtu\.be\/|v=|shorts\/|embed\/)([A-Za-z0-9_-]{11})/,
          );
          return m ? m[1] : "";
        }
        function extraLinks(e) {
          return Object.keys(e.links || {})
            .filter(function (k) {
              return k !== "tiktok" && safeUrl(e.links[k]);
            })
            .map(function (k) {
              return { label: LABELS[k] || k, url: e.links[k] };
            });
        }
        function hasProfile(e) {
          return !!(
            String(e.note || "").trim() ||
            ytId(e.video) ||
            extraLinks(e).length
          );
        }

        /* ---------- small renderers ---------- */
        function avatar(e) {
          var u = safeUrl(e.thumb);
          return (
            '<span class="av">' +
            (u
              ? '<img src="' +
                esc(u) +
                '" alt="" loading="lazy" referrerpolicy="no-referrer">'
              : esc((e.name || "?").trim().charAt(0).toUpperCase())) +
            "</span>"
          );
        }
        function tag(id) {
          var s = styleById[id];
          if (!s) return "";
          var c = HEX.test(s.color) ? s.color : "#8a93a1";
          return (
            '<span class="tag"><span class="sw" style="background:' +
            c +
            '"></span>' +
            esc(s.name) +
            "</span>"
          );
        }

        /* ---------- header and footer, built from site settings ---------- */
        function setupChrome() {
          var site = D.site || {};
          document.title = site.title || "Roblox Funk Editors";
          $("#brand").setAttribute(
            "aria-label",
            site.title || "Roblox Funk Editors",
          );
          $("#brand img").alt = site.title || "Roblox Funk Editors";

          var me = String(site.tiktok || "")
            .replace(/^@/, "")
            .trim();
          var url = "",
            external = false,
            who = "";
          if (/^[A-Za-z0-9._]{1,40}$/.test(me)) {
            url = "https://www.tiktok.com/@" + me;
            external = true;
            who = "@" + me;
          } else {
            var c = String(site.contact || "");
            if (/^(https?:\/\/|mailto:)/i.test(c) && !/example\.com/i.test(c))
              url = c;
          }
          if (url) {
            $("#footCta").innerHTML = external
              ? 'Disagree with a placement? <a href="' +
                esc(url) +
                '" target="_blank" rel="noopener noreferrer">DM ' +
                esc(who) +
                " on TikTok</a>."
              : 'Disagree with a placement? <a href="' +
                esc(url) +
                '">Get in touch</a>.';
          } else {
            $("#footCta").textContent = "";
          }

          $("#footNote").textContent =
            "Rankings are one person's opinion." +
            (site.updated ? " Last updated " + site.updated + "." : "");
        }

        /* ---------- pages ---------- */
        function tabsHtml(active) {
          var all = [
            { k: "main", n: "Overall", c: members("main").length },
          ].concat(
            D.styles.map(function (s) {
              return { k: s.id, n: s.name, c: members(s.id).length };
            }),
          );
          return (
            '<nav class="tabs" aria-label="Rankings">' +
            all
              .map(function (t) {
                return (
                  '<a class="tab" href="#' +
                  esc(t.k) +
                  '"' +
                  (t.k === active ? ' aria-current="page"' : "") +
                  ">" +
                  esc(t.n) +
                  ' <span class="n">' +
                  t.c +
                  "</span></a>"
                );
              })
              .join("") +
            "</nav>"
          );
        }

        function updateTabUnderline() {
          var tabs = $(".tabs");
          var active = $('.tab[aria-current="page"]', tabs);

          if (!tabs || !active) return;

          tabs.style.setProperty("--underline-left", active.offsetLeft + "px");
          tabs.style.setProperty(
            "--underline-width",
            active.offsetWidth + "px",
          );
        }

        function rowHtml(e, rank) {
          var tier = rank <= 3 ? "t" + rank : "";
          var tt = ttUrl(e);
          var handle = shownHandle(e);
          var handleHtml = handle
            ? tt
              ? '<a class="hd handle-link" href="' +
                esc(tt) +
                '" target="_blank" rel="noopener noreferrer" aria-label="Open ' +
                esc(handle) +
                ' on TikTok in a new tab">' +
                esc(handle) +
                '<span class="external-mark" aria-hidden="true">↗</span></a>'
              : '<span class="hd">' + esc(handle) + "</span>"
            : "";
          var inner =
            '<span class="rank">#' +
            rank +
            "</span>" +
            avatar(e) +
            '<span class="who"><span class="nm">' +
            esc(e.name) +
            "</span>" +
            handleHtml +
            "</span>" +
            '<span class="tags">' +
            (e.flares || []).map(tag).join("") +
            "</span>" +
            '<button type="button" class="profile-action" data-profile="' +
            esc(e.id) +
            '" aria-label="View profile for ' +
            esc(e.name) +
            '" title="View profile"><span class="material-symbol" aria-hidden="true">arrow_forward</span></button>';
          return (
            '<li class="row ' +
            tier +
            '" style="animation-delay:' +
            rank * 35 +
            'ms"><div class="main">' +
            inner +
            "</div></li>"
          );
        }

        function renderList() {
          var s = key === "main" ? null : styleById[key];

          var oldTabs = $(".tabs");
          var oldActive = oldTabs && $('.tab[aria-current="page"]', oldTabs);
          var previousUnderline = oldActive
            ? { left: oldActive.offsetLeft, width: oldActive.offsetWidth }
            : null;

          $("#app").innerHTML =
            '<section class="hero"><h1>' +
            esc(listName(key)) +
            "</h1>" +
            '<p class="sub">' +
            (s
              ? "Editors tagged " + esc(s.name) + ", ranked within this style."
              : esc(D.site.subtitle || "")) +
            "</p></section>" +
            tabsHtml(key) +
            '<div class="controls"><label class="sr" for="q">Search editors</label>' +
            '<div class="search-wrap">' +
            '<svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>' +
            '<input id="q" type="search" aria-label="Search editors by name or handle" placeholder="Search by name or handle" autocomplete="off" value="' +
            esc(query) +
            '">' +
            '<span class="count" id="count" role="status" aria-live="polite"></span>' +
            "</div></div>" +
            '<ol class="list" id="list" tabindex="-1"></ol>';

          var tabs = $(".tabs");
          var activeTab = tabs && $('.tab[aria-current="page"]', tabs);

          if (tabs && activeTab) {
            var firstRender = !previousUnderline;

            if (firstRender) {
              tabs.classList.add("no-transition");
            } else {
              tabs.style.setProperty(
                "--underline-left",
                previousUnderline.left + "px",
              );
              tabs.style.setProperty(
                "--underline-width",
                previousUnderline.width + "px",
              );
              void tabs.offsetWidth;
            }

            tabs.style.setProperty(
              "--underline-left",
              activeTab.offsetLeft + "px",
            );
            tabs.style.setProperty(
              "--underline-width",
              activeTab.offsetWidth + "px",
            );

            if (s && s.color) {
              tabs.style.setProperty("--underline-color", s.color);
            } else {
              tabs.style.removeProperty("--underline-color");
            }

            if (firstRender) {
              requestAnimationFrame(function () {
                tabs.classList.remove("no-transition");
              });
            }
          }

          if (tabs && activeTab) {
            if (previousUnderline) {
              tabs.style.setProperty(
                "--underline-left",
                previousUnderline.left + "px",
              );
              tabs.style.setProperty(
                "--underline-width",
                previousUnderline.width + "px",
              );
              void tabs.offsetWidth;
            }

            tabs.style.setProperty(
              "--underline-left",
              activeTab.offsetLeft + "px",
            );
            tabs.style.setProperty(
              "--underline-width",
              activeTab.offsetWidth + "px",
            );
          }

          document.title =
            listName(key) + " | " + (D.site.title || "Roblox Funk Editors");

          var draw = function () {
            var all = members(key),
              q = query.trim().toLowerCase();

            var rows = all
              .map(function (e, i) {
                return { e: e, rank: i + 1 };
              })
              .filter(function (r) {
                return (
                  !q ||
                  (r.e.name + " " + shownHandle(r.e)).toLowerCase().indexOf(q) >
                    -1
                );
              });

            $("#count").textContent = rows.length + "/" + all.length;
            $("#list").innerHTML = rows.length
              ? rows
                  .map(function (r) {
                    return rowHtml(r.e, r.rank);
                  })
                  .join("")
              : '<li class="empty">' +
                (all.length
                  ? "No editors match that search."
                  : s
                    ? "No editors are tagged " + esc(s.name) + " yet."
                    : "No editors have been ranked yet.") +
                "</li>";
          };

          $("#q").addEventListener("input", function (ev) {
            query = ev.target.value;
            $("#list").classList.add("searching");
            draw();
          });

          draw();
        }

        function showLoading() {
          var rows = "";
          for (var i = 0; i < 6; i++)
            rows +=
              '<li class="row sk"><div class="main"><span class="rank"></span><span class="av"></span><span class="who"><span class="bar1"></span><span class="bar2"></span></span></div></li>';
          $("#app").innerHTML =
            '<section class="hero"><h1>Loading</h1><p class="sub">Getting the latest ranking.</p></section><ol class="list" aria-busy="true" style="margin-top:24px">' +
            rows +
            "</ol>";
        }
        function showError() {
          $("#app").innerHTML =
            '<div class="state"><h2>The list did not load</h2><p>The ranking could not be fetched. Check your connection, then try again.</p><button type="button" class="btn" id="retry">Try again</button></div>';
          $("#retry").addEventListener("click", init);
        }

        /* ---------- profile drawer ---------- */
        function openProfile(id) {
          var e = byId[id],
            dlg = $("#drawer");
          if (!e) return;
          var ranks = ["main"]
            .concat(
              D.styles.map(function (s) {
                return s.id;
              }),
            )
            .map(function (k) {
              return { k: k, r: rankIn(e, k) };
            })
            .filter(function (x) {
              return x.r > 0;
            });
          var tt = ttUrl(e),
            vid = ytId(e.video),
            links = extraLinks(e),
            note = String(e.note || "").trim();
          var ext =
            (tt
              ? '<a href="' +
                esc(tt) +
                '" target="_blank" rel="noopener noreferrer">TikTok<span class="sr"> (opens in a new tab)</span></a>'
              : "") +
            links
              .map(function (l) {
                return (
                  '<a href="' +
                  esc(l.url) +
                  '" target="_blank" rel="noopener noreferrer">' +
                  esc(l.label) +
                  '<span class="sr"> (opens in a new tab)</span></a>'
                );
              })
              .join("");
          dlg.innerHTML =
            '<div class="d"><div class="d-head">' +
            avatar(e) +
            '<div class="t"><h2 id="dName">' +
            esc(e.name) +
            '</h2><div class="hd">' +
            esc(shownHandle(e)) +
            "</div>" +
            '<div class="flares">' +
            (e.flares || []).map(tag).join("") +
            "</div></div>" +
            '<button type="button" class="x" data-close aria-label="Close profile"><span class="material-symbol" aria-hidden="true">close</span></button></div>' +
            '<div class="d-body">' +
            (ranks.length
              ? '<section><h3>Placements</h3><ul class="pl">' +
                ranks
                  .map(function (x) {
                    return (
                      '<li><a href="#' +
                      esc(x.k) +
                      '" data-nav><span>' +
                      esc(listName(x.k)) +
                      "</span><b>#" +
                      x.r +
                      "</b></a></li>"
                    );
                  })
                  .join("") +
                "</ul></section>"
              : "") +
            (String(e.software || "").trim()
              ? '<section><h3>Editing software</h3><p class="note">' + esc(e.software) + "</p></section>"
              : "") +
            (note
              ? '<section><h3>About</h3><p class="note">' +
                esc(note) +
                "</p></section>"
              : "") +
            (vid
              ? '<section><h3>Showcase</h3><div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/' +
                esc(vid) +
                '" title="Showcase edit by ' +
                esc(e.name) +
                '" allowfullscreen loading="lazy"></iframe></div></section>'
              : "") +
            (ext
              ? '<section><h3>Links</h3><div class="ext">' +
                ext +
                "</div></section>"
              : "") +
            "</div></div>";
          if (dlg.showModal) dlg.showModal();
          else dlg.setAttribute("open", "");
          document.body.classList.add("lock");
          var first = $("[data-close]", dlg);
          if (first) first.focus();
        }
        function closeProfile() {
          var dlg = $("#drawer");
          if (dlg.close) dlg.close();
          else dlg.removeAttribute("open");
          document.body.classList.remove("lock");
        }

        /* ---------- routing and boot ---------- */
        function route() {
          var h = location.hash.replace(/^#/, "");
          key = !h || h === "main" || styleById[h] ? h || "main" : "main";
          renderList();
        }

        // Hosted pages use only the database; an empty/wrong project must never
        // masquerade as reset rankings by displaying bundled placeholder data.
        async function loadData() {
          if (!/^https?:$/.test(location.protocol)) return window.SITE_DATA;
          var r = await fetch("/api/data", { cache: "no-store" });
          if (!r.ok) throw new Error("status " + r.status);
          var j = await r.json();
          if (!valid(j)) throw new Error("bad data");
          return j;
        }

        async function init() {
          showLoading();
          try {
            D = await loadData();
            if (!valid(D)) throw new Error("bad data");
          } catch (err) {
            showError();
            return;
          }
          byId = {};
          D.editors.forEach(function (e) {
            byId[e.id] = e;
          });
          styleById = {};
          D.styles.forEach(function (s) {
            styleById[s.id] = s;
          });
          setupChrome();
          route();
          if(/^https?:$/.test(location.protocol)&&!watching){
            watching=true;
            import("../assets/autosave.js").then(({watchChanges})=>watchChanges(refreshLive)).catch(()=>{watching=false});
          }
          if (!hashBound) {
            window.addEventListener("hashchange", function () {
              if (D) route();
            });
            hashBound = true;
          }
        }

        document.addEventListener("click", function (ev) {
          var p = ev.target.closest && ev.target.closest("[data-profile]");
          if (p) {
            openProfile(p.getAttribute("data-profile"));
          }
        });
        var dlg = $("#drawer");
        dlg.addEventListener("click", function (ev) {
          if (
            ev.target === dlg ||
            (ev.target.closest && ev.target.closest("[data-close]")) ||
            (ev.target.closest && ev.target.closest("[data-nav]"))
          )
            closeProfile();
        });
        dlg.addEventListener("close", function () {
          document.body.classList.remove("lock");
        });

        var watching=false;
        async function refreshLive(){
          if(!D||$("#drawer").open)return;
          const next=await loadData();if(JSON.stringify(next)===JSON.stringify(D))return;
          const input=$("#q"),focused=document.activeElement===input,start=input?.selectionStart,end=input?.selectionEnd,scroll=window.scrollY;
          D=next;byId={};D.editors.forEach(e=>{byId[e.id]=e});styleById={};D.styles.forEach(s=>{styleById[s.id]=s});
          setupChrome();route();
          if(focused&&$("#q")){$("#q").focus({preventScroll:true});$("#q").setSelectionRange(start,end)}
          window.scrollTo({top:scroll,behavior:"instant"});
        }
        init();
      })();
    </script>
  </body>
</html>
